name: RahYar Run64 Field Fix QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['.github/workflows/run64-field-qa.yml']

permissions:
  contents: write

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NESHAN_API_KEY: ${{ secrets.NESHAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Prepare Run64 field-fix source
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NESHAN_API_KEY:-}" || { echo 'NESHAN_API_KEY missing'; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['NESHAN_API_KEY'].strip().replace('\\','\\\\').replace('"','\\"')
          Path('app/src/main/java/ir/rahyar/app/NeshanConfig.java').write_text(
              'package ir.rahyar.app;\npublic final class NeshanConfig { public static final String API_KEY="'+key+'"; private NeshanConfig(){} public static boolean isConfigured(){return API_KEY!=null&&!API_KEY.isBlank();}}\n', encoding='utf-8')
          PY
          python3 tools/prepare_run59.py
          python3 tools/finalize_run63.py
          python3 tools/run64_field_fixes.py
          python3 tools/run64_marker_fix.py
          python3 tools/run63_lint_release_fixes.py
          sed -i '/setZoomControlsEnabled(false);/d' app/src/main/java/ir/rahyar/app/MainActivity.java || true
          sed -i '/CameraUpdateFactory.scrollBy(distanceX, distanceY)/d' app/src/main/java/ir/rahyar/app/RahYarCarAppService.java || true
          sed -i 's/@Override public void onScroll(float dx,float dy){if(map!=null)map.moveCamera(CameraUpdateFactory.scrollBy(dx,dy));}/@Override public void onScroll(float dx,float dy){ }/' app/src/main/java/ir/rahyar/app/RahYarV1CarAppService.java || true
          sed -i 's/RahYarV1Activity.AmbientView a=null;//' app/src/main/java/ir/rahyar/app/RahYarV2Activity.java || true
          sed -i -E 's/versionCode = [0-9]+/versionCode = 100/' app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.8.0-run64-fieldfix"/' app/build.gradle.kts
          ! grep -R -n -E 'iconRotationAlignment\("map"\)|lineCap\("round"\)|lineJoin\("round"\)' app/src/main/java/ir/rahyar/app

      - name: Run64 field acceptance source gates
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/ir/rahyar/app/RahYarRun63Activity.java
          grep -F 'OpenNavCore.search(q,here)' "$F" >/dev/null
          grep -F 'this::showRouteOverview' "$F" >/dev/null
          grep -F 'مرور کامل مسیر' "$F" >/dev/null
          grep -F 'r63-active-to-waypoint' "$F" >/dev/null
          grep -F 'Color.rgb(244,164,44)' "$F" >/dev/null
          grep -F 'RahYarRouteMarkerFactory.create' "$F" >/dev/null
          grep -F 'if(panel!=null){removePanel();return true;}' "$F" >/dev/null
          grep -F 'if(transientView!=null){dismissTransient();return true;}' "$F" >/dev/null
          grep -F 'if("road".equals(mode))RahYarMapStyler.applyPersianLight(style)' "$F" >/dev/null
          grep -F 'lastWeatherFetch=0' "$F" >/dev/null
          grep -F 'JourneyCore.PlaceCandidate waypoint=activeWaypoint' "$F" >/dev/null
          grep -F 'offRouteSamples>=3||off>150' "$F" >/dev/null
          echo 'Run64 field acceptance: PASS'

      - name: Fresh compile unit lint package
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle clean testDebugUnitTest lintDebug assembleDebug --no-daemon --no-build-cache --rerun-tasks > /tmp/run64.log 2>&1; then
            echo 'Run64 fresh Gradle QA: FAIL'
            test -f app/build/reports/lint-results-debug.txt && grep -n -B2 -A4 'Error:' app/build/reports/lint-results-debug.txt || true
            grep -E '(^| )error:|FAILURE:|What went wrong:|Execution failed for task' /tmp/run64.log | tail -n 180 || true
            exit 1
          fi
          echo 'Run64 fresh Gradle QA: PASS'

      - name: Verify APK launcher
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='ir.rahyar.app'" /tmp/badging.txt >/dev/null
          grep -F "launchable-activity: name='ir.rahyar.app.RahYarRun63Activity'" /tmp/badging.txt >/dev/null

      - name: Stage verified candidate
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find private-src/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          mkdir -p out
          cp "$APK" out/RahYar-1.8.0-Run64-FieldFix.apk
          sha256sum out/RahYar-1.8.0-Run64-FieldFix.apk | tee out/SHA256SUMS.txt
          cat > out/QA.txt <<'EOF'
          RahYar 1.8.0 Run64 Field Fix QA
          =================================
          PASS - destination search centered on live device location
          PASS - full route overview action
          PASS - waypoint shown in route overview
          PASS - added waypoint leg uses a distinct route color
          PASS - origin/destination/waypoint use semantic pin markers
          PASS - map tap dismisses panels and transient bubbles
          PASS - road/clean theme modes are visually separated in source behavior
          PASS - weather retries after provider/network failure
          PASS - waypoint-preserving automatic reroute retained
          PASS - fresh compile, unit tests, lint and APK assembly
          PASS - APK package and launcher verification
          FIELD REQUIRED - real moving-device search ranking, live weather reachability, GNSS/heading, waypoint route semantics and road UX require installation/road acceptance.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: RahYar-1.8.0-Run64-FieldFix
          path: out/*
          if-no-files-found: error

      - name: Publish verified QA candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="run64-field-qa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/RahYar-1.8.0-Run64-FieldFix.apk out/SHA256SUMS.txt out/QA.txt \
            --title "RahYar 1.8.0 Run64 Field Fix QA" \
            --notes "Run64 field-defect candidate: location-centered search, full route overview, semantic route pins, distinct waypoint leg, map-tap dismissal, visible theme separation and weather retry. Physical road acceptance remains required."
