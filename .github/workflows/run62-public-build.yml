name: RahYar Run63 Navigation UX Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run62-public-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NESHAN_API_KEY: ${{ secrets.NESHAN_API_KEY }}
    steps:
      - name: Checkout public build repository
        uses: actions/checkout@v4

      - name: Checkout private RahYar source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-src
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Run63 private source
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NESHAN_API_KEY:-}" || { echo 'Required NESHAN_API_KEY secret is missing.'; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['NESHAN_API_KEY'].strip().replace('\\','\\\\').replace('"','\\"')
          Path('app/src/main/java/ir/rahyar/app/NeshanConfig.java').write_text(
              'package ir.rahyar.app;\n\npublic final class NeshanConfig {\n'
              '    public static final String API_KEY = "'+key+'";\n'
              '    private NeshanConfig() { }\n'
              '    public static boolean isConfigured() { return API_KEY != null && !API_KEY.isBlank(); }\n'
              '}\n', encoding='utf-8')
          PY
          python3 tools/prepare_run63.py
          sed -i '/setZoomControlsEnabled(false);/d' app/src/main/java/ir/rahyar/app/MainActivity.java || true
          sed -i '/CameraUpdateFactory.scrollBy(distanceX, distanceY)/d' app/src/main/java/ir/rahyar/app/RahYarCarAppService.java || true
          sed -i 's/@Override public void onScroll(float dx,float dy){if(map!=null)map.moveCamera(CameraUpdateFactory.scrollBy(dx,dy));}/@Override public void onScroll(float dx,float dy){ }/' app/src/main/java/ir/rahyar/app/RahYarV1CarAppService.java || true
          sed -i 's/RahYarV1Activity.AmbientView a=null;//' app/src/main/java/ir/rahyar/app/RahYarV2Activity.java || true
          sed -i -E 's/versionCode = [0-9]+/versionCode = 99/' app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.7.9-run63-navigation-ux"/' app/build.gradle.kts

      - name: Run63 navigation acceptance gates
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -F 'navItem("پایان",RahYarIconTextView.Icon.END' "$F" >/dev/null
          grep -F 'RahYarIconTextView.Icon.TURN_LEFT' "$F" >/dev/null
          grep -F 'RahYarIconTextView.Icon.TURN_RIGHT' "$F" >/dev/null
          grep -F 'dark-matter-gl-style/style.json' "$F" >/dev/null
          grep -F 'if(!forced&&off<80&&now-lastRerouteCheck<30000)return;' "$F" >/dev/null
          grep -F 'private void showWaypointBubble()' "$F" >/dev/null
          grep -F 'شروع مسیریابی' "$F" >/dev/null
          grep -F '۱.۷.۹ · Run63' app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java >/dev/null
          echo 'Run63 static navigation gates: PASS'

      - name: Compile and unit-test private source
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle clean testDebugUnitTest assembleDebug --no-daemon > /tmp/rahyar-build.log 2>&1; then
            echo 'Run63 compile/test failed. Detailed private-source compiler output is intentionally not published.'
            exit 1
          fi

      - name: Stage APK only
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find private-src/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/RahYar-1.7.9-Run63-Navigation-UX.apk
          sha256sum out/RahYar-1.7.9-Run63-Navigation-UX.apk > out/SHA256SUMS.txt

      - name: Publish Run63 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="run63-navigation-ux-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            out/RahYar-1.7.9-Run63-Navigation-UX.apk \
            out/SHA256SUMS.txt \
            --title "RahYar 1.7.9 Run63 Navigation UX" \
            --notes "Run63 candidate: navigation camera look-ahead, maneuver icon mapping, visible End action, real map theme switching, compact upcoming-turn overlay, waypoint recovery, faster reroute response. Private source remains private; only APK/checksum are public."
