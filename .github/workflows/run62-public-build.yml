name: RahYar Run62 Public Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NESHAN_API_KEY: ${{ secrets.NESHAN_API_KEY }}
    steps:
      - name: Checkout public build repository
        uses: actions/checkout@v4

      - name: Checkout private RahYar source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-src
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare private source
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NESHAN_API_KEY:-}" || { echo 'Required NESHAN_API_KEY secret is missing.'; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['NESHAN_API_KEY'].strip().replace('\\','\\\\').replace('"','\\"')
          Path('app/src/main/java/ir/rahyar/app/NeshanConfig.java').write_text(
              'package ir.rahyar.app;\n\npublic final class NeshanConfig {\n'
              '    public static final String API_KEY = "'+key+'";\n'
              '    private NeshanConfig() { }\n'
              '    public static boolean isConfigured() { return API_KEY != null && !API_KEY.isBlank(); }\n'
              '}\n', encoding='utf-8')
          PY
          python3 tools/prepare_run59.py
          sed -i '/setZoomControlsEnabled(false);/d' app/src/main/java/ir/rahyar/app/MainActivity.java || true
          sed -i '/CameraUpdateFactory.scrollBy(distanceX, distanceY)/d' app/src/main/java/ir/rahyar/app/RahYarCarAppService.java || true
          sed -i 's/@Override public void onScroll(float dx,float dy){if(map!=null)map.moveCamera(CameraUpdateFactory.scrollBy(dx,dy));}/@Override public void onScroll(float dx,float dy){ }/' app/src/main/java/ir/rahyar/app/RahYarV1CarAppService.java || true
          sed -i 's/RahYarV1Activity.AmbientView a=null;//' app/src/main/java/ir/rahyar/app/RahYarV2Activity.java || true
          sed -i -E 's/versionCode = [0-9]+/versionCode = 98/' app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.7.8-run62-navigation-recovery"/' app/build.gradle.kts
          sed -i 's/۱.۷.۵ · Run59/۱.۷.۸ · Run62/' app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java || true

      - name: Build private source without exposing source logs
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle clean assembleDebug --no-daemon > /tmp/rahyar-build.log 2>&1; then
            echo 'Private RahYar build failed. Detailed compiler output is intentionally not published from this public workflow.'
            exit 1
          fi

      - name: Stage APK only
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find private-src/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/RahYar-1.7.8-Run62-Navigation-Recovery.apk
          sha256sum out/RahYar-1.7.8-Run62-Navigation-Recovery.apk > out/SHA256SUMS.txt

      - name: Publish APK to public build repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="run62-public-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            out/RahYar-1.7.8-Run62-Navigation-Recovery.apk \
            out/SHA256SUMS.txt \
            --title "RahYar 1.7.8 Run62 Navigation Recovery" \
            --notes "Public binary build from private RahYar source. Source remains private; only APK and checksum are published."
