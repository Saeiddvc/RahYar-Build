name: RahYar Development Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-run39.yml'
      - 'ci/**'
      - 'qa/**'
  pull_request:
    branches: [ main, develop ]

permissions: { contents: read }

jobs:
  compile-check:
    name: Run51 Compile + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply Run40 + Run41 + Run42 + Run43
        shell: bash
        run: |
          set -euo pipefail
          cat ci/source.part0.b64 ci/source.part1.b64 ci/source.part2.b64 ci/source.part3.b64 | base64 -d > /tmp/base.tar.zst
          mkdir project
          tar --zstd -xf /tmp/base.tar.zst -C project

          cat ci/run40.diff.0 ci/run40.diff.1 > /tmp/run40.diff
          cd project
          patch -p1 < /tmp/run40.diff
          patch -p1 < ../ci/run40.fix1.diff
          cd ..

          cat ci/run41b.diff.0 ci/run41b.diff.1 ci/run41b.diff.2 ci/run41b.diff.3 > /tmp/run41.diff
          cd project
          patch -p2 < /tmp/run41.diff
          cd ..

          cat ci/run42.diff.0 ci/run42.diff.1 ci/run42.diff.2 ci/run42.diff.3 ci/run42.diff.4 ci/run42.diff.5 > /tmp/run42.diff
          cd project
          patch -p1 < /tmp/run42.diff
          cd ..

          cat ci/run43.diff.0 ci/run43.diff.1 ci/run43.diff.2 ci/run43.diff.3 ci/run43.diff.4 ci/run43.diff.5 > /tmp/run43.diff
          cd project
          patch -p1 < /tmp/run43.diff
          patch -p1 < ../ci/run43.fix1.diff
          patch -p1 < ../ci/run44.diff

          python3 - <<'PY'
          from pathlib import Path

          core = Path("app/src/main/java/ir/rahyar/app/core/navigation/PoiDetour.kt")
          core.write_text("""package ir.rahyar.app.core.navigation

          import ir.rahyar.app.domain.models.Route
          import kotlin.math.roundToInt

          data class PoiDetourMetrics(
              val distanceMeters: Int,
              val durationMinutes: Int
          )

          fun calculatePoiDetour(baseRoute: Route, routeWithStop: Route): PoiDetourMetrics? {
              if (baseRoute.distanceKm <= 0.0 || baseRoute.durationMinutes <= 0) return null
              if (routeWithStop.distanceKm <= 0.0 || routeWithStop.durationMinutes <= 0) return null
              return PoiDetourMetrics(
                  distanceMeters = ((routeWithStop.distanceKm - baseRoute.distanceKm).coerceAtLeast(0.0) * 1000.0).roundToInt(),
                  durationMinutes = (routeWithStop.durationMinutes - baseRoute.durationMinutes).coerceAtLeast(0)
              )
          }
          """)

          active = Path("app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt")
          text = active.read_text()
          lines = text.splitlines()
          metric_index = next(
              (i for i, line in enumerate(lines)
               if "detourDistanceMeters = ((withStop.distanceKm - baseline.distanceKm)" in line),
              -1
          )
          if metric_index < 1:
              raise SystemExit("Run44 detour integration target not found")
          indent = lines[metric_index - 1][:len(lines[metric_index - 1]) - len(lines[metric_index - 1].lstrip())]
          lines[metric_index - 1:metric_index + 3] = [
              indent + "val detour = ir.rahyar.app.core.navigation.calculatePoiDetour(baseline, withStop)",
              indent + "    ?: return@mapNotNull null",
              indent + "poi.copy(",
              indent + "    detourDistanceMeters = detour.distanceMeters,",
              indent + "    detourDurationMinutes = detour.durationMinutes",
              indent + ")",
          ]
          active.write_text("\n".join(lines) + "\n")

          detour_test = Path("app/src/test/java/ir/rahyar/app/core/navigation/PoiDetourTest.kt")
          detour_test.parent.mkdir(parents=True, exist_ok=True)
          detour_test.write_text("""package ir.rahyar.app.core.navigation

          import ir.rahyar.app.domain.models.LatLng
          import ir.rahyar.app.domain.models.Route
          import ir.rahyar.app.domain.models.RouteType
          import ir.rahyar.app.domain.models.TransportMode
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test
          import java.time.LocalDateTime

          class PoiDetourTest {
              private fun route(distanceKm: Double, durationMinutes: Int): Route = Route(
                  id = "r-$distanceKm-$durationMinutes",
                  type = RouteType.RECOMMENDED,
                  points = listOf(LatLng(35.83, 50.95), LatLng(35.82, 51.00)),
                  durationMinutes = durationMinutes,
                  distanceKm = distanceKm,
                  eta = LocalDateTime.now(),
                  transportMode = TransportMode.CAR
              )

              @Test fun realRouteDifferenceProducesDetourDistanceAndDuration() {
                  val detour = calculatePoiDetour(route(7.0, 18), route(8.25, 23))
                  assertEquals(1250, detour?.distanceMeters)
                  assertEquals(5, detour?.durationMinutes)
              }

              @Test fun unavailableBaseRouteNeverProducesFakeZeroDetour() {
                  assertNull(calculatePoiDetour(route(0.0, 0), route(8.25, 23)))
              }

              @Test fun unavailableStopRouteNeverProducesFakeZeroDetour() {
                  assertNull(calculatePoiDetour(route(7.0, 18), route(0.0, 0)))
              }
          }
          """)

          segment_planner = Path("app/src/main/java/ir/rahyar/app/core/navigation/RouteSegmentPlanner.kt")
          segment_planner.write_text("""package ir.rahyar.app.core.navigation

          import ir.rahyar.app.domain.models.ItineraryStop
          import ir.rahyar.app.domain.models.LatLng
          import ir.rahyar.app.domain.models.Route
          import ir.rahyar.app.domain.models.StopStatus
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.sqrt

          data class RouteSegmentSlice(
              val index: Int,
              val points: List<LatLng>
          )

          fun splitRouteByPendingStops(route: Route, stops: List<ItineraryStop>): List<RouteSegmentSlice> {
              if (route.points.size < 2) return emptyList()
              val pending = stops.filter { it.status == StopStatus.PENDING }.sortedBy { it.order }
              if (pending.isEmpty()) return listOf(RouteSegmentSlice(0, route.points))

              val cuts = mutableListOf<Int>()
              var previous = 0
              pending.forEach { stop ->
                  val nearest = route.points.indices
                      .filter { it >= previous }
                      .minByOrNull { geoDistanceMeters(route.points[it], stop.location) }
                      ?: return@forEach
                  val cut = nearest.coerceIn((previous + 1).coerceAtMost(route.points.lastIndex), route.points.lastIndex)
                  if (cut > previous && cut < route.points.lastIndex) {
                      cuts += cut
                      previous = cut
                  }
              }

              val boundaries = listOf(0) + cuts.distinct() + listOf(route.points.lastIndex)
              return boundaries.zipWithNext().mapIndexedNotNull { index, (start, end) ->
                  if (end <= start) null else RouteSegmentSlice(index, route.points.subList(start, end + 1))
              }
          }

          private fun geoDistanceMeters(a: LatLng, b: LatLng): Double {
              val r = 6_371_000.0
              val dLat = Math.toRadians(b.latitude - a.latitude)
              val dLon = Math.toRadians(b.longitude - a.longitude)
              val lat1 = Math.toRadians(a.latitude)
              val lat2 = Math.toRadians(b.latitude)
              val h = sin(dLat / 2) * sin(dLat / 2) + cos(lat1) * cos(lat2) * sin(dLon / 2) * sin(dLon / 2)
              return r * 2 * atan2(sqrt(h), sqrt(1 - h))
          }
          """)

          segment_test = Path("app/src/test/java/ir/rahyar/app/core/navigation/RouteSegmentPlannerTest.kt")
          segment_test.write_text("""package ir.rahyar.app.core.navigation

          import ir.rahyar.app.domain.models.ItineraryStop
          import ir.rahyar.app.domain.models.LatLng
          import ir.rahyar.app.domain.models.Route
          import ir.rahyar.app.domain.models.RouteType
          import ir.rahyar.app.domain.models.StopStatus
          import ir.rahyar.app.domain.models.TransportMode
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import java.time.LocalDateTime

          class RouteSegmentPlannerTest {
              private val points = listOf(
                  LatLng(35.830, 50.950), LatLng(35.830, 50.960), LatLng(35.830, 50.970),
                  LatLng(35.830, 50.980), LatLng(35.830, 50.990), LatLng(35.830, 51.000)
              )
              private val route = Route(
                  id = "segments", type = RouteType.RECOMMENDED, points = points,
                  durationMinutes = 15, distanceKm = 5.0, eta = LocalDateTime.now(), transportMode = TransportMode.CAR
              )

              @Test fun twoPendingStopsProduceThreeIndependentSegments() {
                  val stops = listOf(
                      ItineraryStop("s1", LatLng(35.830, 50.970), 1, StopStatus.PENDING),
                      ItineraryStop("s2", LatLng(35.830, 50.990), 2, StopStatus.PENDING)
                  )
                  val segments = splitRouteByPendingStops(route, stops)
                  assertEquals(3, segments.size)
                  assertEquals(points.first(), segments.first().points.first())
                  assertEquals(points.last(), segments.last().points.last())
                  assertTrue(segments.all { it.points.size >= 2 })
                  assertEquals(segments[0].points.last(), segments[1].points.first())
                  assertEquals(segments[1].points.last(), segments[2].points.first())
              }

              @Test fun arrivedOrSkippedStopsDoNotSplitActiveRoute() {
                  val stops = listOf(
                      ItineraryStop("done", LatLng(35.830, 50.970), 1, StopStatus.ARRIVED),
                      ItineraryStop("skip", LatLng(35.830, 50.990), 2, StopStatus.SKIPPED)
                  )
                  assertEquals(1, splitRouteByPendingStops(route, stops).size)
              }
          }
          """)

          segment_text = active.read_text()
          if "routeSegmentPolylines" not in segment_text:
              segment_text = segment_text.replace(
                  "    var routePolyline by remember { mutableStateOf<Polyline?>(null) }\n",
                  "    var routePolyline by remember { mutableStateOf<Polyline?>(null) }\n    var routeSegmentPolylines by remember { mutableStateOf<List<Polyline>>(emptyList()) }\n",
                  1
              )
              segment_text = segment_text.replace(
                  "    LaunchedEffect(mapRef, active?.route?.id, zoomLevel) {",
                  "    LaunchedEffect(mapRef, active?.route?.id, zoomLevel, session.itinerary?.stops) {",
                  1
              )
              segment_text = segment_text.replace(
                  "        routePolyline?.let(map::removePolyline)\n",
                  "        routePolyline?.let(map::removePolyline)\n        routeSegmentPolylines.forEach { runCatching { map.removePolyline(it) } }\n        routeSegmentPolylines = emptyList()\n",
                  1
              )
              route_old = """            routePolyline = map.addPolyline(
                          PolylineOptions()
                              .addAll(points)
                              .color(AndroidColor.parseColor("#00D1D1"))
                              .width(routeWidth)
                      )"""
              route_new = """            val segments = ir.rahyar.app.core.navigation.splitRouteByPendingStops(
                          currentRoute,
                          session.itinerary?.stops.orEmpty()
                      )
                      val segmentColors = listOf("#00D1D1", "#FFB020", "#8B5CF6", "#22C55E", "#EC4899")
                      if (segments.size <= 1) {
                          routePolyline = map.addPolyline(
                              PolylineOptions()
                                  .addAll(points)
                                  .color(AndroidColor.parseColor("#00D1D1"))
                                  .width(routeWidth)
                          )
                      } else {
                          routePolyline = null
                          routeSegmentPolylines = segments.map { segment ->
                              map.addPolyline(
                                  PolylineOptions()
                                      .addAll(segment.points.map { MapLatLng(it.latitude, it.longitude) })
                                      .color(AndroidColor.parseColor(segmentColors[segment.index % segmentColors.size]))
                                      .width(routeWidth)
                              )
                          }
                      }"""
              if route_old not in segment_text:
                  raise SystemExit("Run44 route segment render target not found")
              segment_text = segment_text.replace(route_old, route_new, 1)
              active.write_text(segment_text)

          waypoint_test = Path("app/src/test/java/ir/rahyar/app/navigation/NavigationSessionWaypointTest.kt")
          wt = waypoint_test.read_text()
          extra = """
              @Test fun arrivingAtStopThenSelectingContinuationRouteKeepsFinalDestinationAndSessionAlive() {
                  val session = NavigationSession()
                  val destination = LatLng(35.82, 51.00)
                  session.setOrigin(LatLng(35.83, 50.95))
                  session.setDestination(destination)
                  session.addStop(LatLng(35.825, 50.98), "fuel-1")
                  session.beginNavigation(route("to-stop"))
                  session.updateStopStatus("fuel-1", StopStatus.ARRIVED)
                  session.selectRoute(route("continue-to-destination"))
                  val state = session.state.value
                  assertEquals(destination, state.destination)
                  assertEquals(destination, state.itinerary?.destination)
                  assertEquals(StopStatus.ARRIVED, state.itinerary?.stops?.single()?.status)
                  assertTrue(state.navigationState is NavigationState.Navigating)
              }
          """
          if "arrivingAtStopThenSelectingContinuationRouteKeepsFinalDestinationAndSessionAlive" not in wt:
              pos = wt.rfind("}")
              if pos < 0:
                  raise SystemExit("Waypoint test class closing brace not found")
              waypoint_test.write_text(wt[:pos] + extra + wt[pos:])
          PY

          python3 ../ci/run45.weather.py
          python3 ../ci/run46.search.py
          python3 ../ci/run47.providers.py
          python3 ../ci/run48.state-separation.py
          python3 ../ci/run49.gps-hud.py
          python3 ../ci/run50.maneuver-geometry.py
          python3 ../ci/run51.ui-safety.py

          sed -i 's/versionCode = 21/versionCode = 29/' app/build.gradle.kts
          sed -i 's/versionName = "1.5.9-run43-road-awareness"/versionName = "1.6.7-run51-ui-safety"/' app/build.gradle.kts
          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'versionName = "1.6.7-run51-ui-safety"' app/build.gradle.kts

      - name: Inspect Trip Story and repository wiring
        working-directory: project
        shell: bash
        run: |
          echo '--- TrafficInfo model ---'
          grep -R -n -A120 -B20 'data class TrafficInfo' app/src/main/java || true
          echo '--- WeatherInfo model ---'
          grep -R -n -A160 -B20 'data class WeatherInfo' app/src/main/java || true
          echo '--- TripStoryStore ---'
          sed -n '1,300p' app/src/main/java/ir/rahyar/app/data/local/TripStoryStore.kt || find app/src/main/java -name '*TripStory*' -type f -maxdepth 10 -print -exec sed -n '1,300p' {} \;
          echo '--- NavigationControls ---'
          sed -n '1,240p' app/src/main/java/ir/rahyar/app/ui/components/NavigationControls.kt
          echo '--- Active imports and signatures ---'
          sed -n '1,230p' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          echo '--- TripStory sheet tail ---'
          sed -n '738,1040p' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          echo 'TRIP_STORY_INSPECTION_DONE'
          exit 86

