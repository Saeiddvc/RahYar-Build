          grep -q 'startNavigationGate.tryAcquire(SystemClock.elapsedRealtime())' app/src/main/java/ir/rahyar/app/ui/screens/RahyarMapScreen.kt
          grep -q 'cameraPadding = previewCameraPadding' app/src/main/java/ir/rahyar/app/ui/screens/RahyarMapScreen.kt
          grep -q 'LaunchedEffect(mapRef, cameraFitKey)' app/src/main/java/ir/rahyar/app/ui/screens/RahyarMapScreen.kt
          grep -q 'cameraPadding.bottom' app/src/main/java/ir/rahyar/app/ui/screens/RahyarMapScreen.kt
          grep -q 'selectRoutePreviewRoutes' app/src/main/java/ir/rahyar/app/ui/components/RoutePreviewSheet.kt
          grep -q 'malformedRoutesAreExcludedBeforeMapOrPreviewRendering' app/src/test/java/ir/rahyar/app/core/navigation/RoutePreviewSafetyTest.kt
          grep -q 'safeCameraPaddingReservesActualBottomOverlaySpace' app/src/test/java/ir/rahyar/app/core/navigation/RoutePreviewSafetyTest.kt
          grep -q 'sheetVisibilityDoesNotChangeCameraFitKey' app/src/test/java/ir/rahyar/app/core/navigation/RoutePreviewSafetyTest.kt
          grep -q 'rapidDoubleStartIsRejectedButRetryDoesNotFreeze' app/src/test/java/ir/rahyar/app/core/navigation/RoutePreviewSafetyTest.kt
          grep -q 'stickyStartRequiresValidSelectedRouteAndNoBlockingOverlay' app/src/test/java/ir/rahyar/app/core/navigation/RoutePreviewSafetyTest.kt

      - name: Maneuver distance geometry checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fun distanceAlongRouteToLocationMeters' app/src/main/java/ir/rahyar/app/core/navigation/ManeuverGeometry.kt
          grep -q 'distanceAlongRouteToLocationMeters(' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'turnGeometrySumsBothPolylineLegsNotAirDistance' app/src/test/java/ir/rahyar/app/core/navigation/ManeuverGeometryTest.kt
          grep -q 'targetBehindCurrentIsNotReportedAsUpcomingManeuver' app/src/test/java/ir/rahyar/app/core/navigation/ManeuverGeometryTest.kt
          ! grep -A25 'private fun nextManeuver' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt | grep -q 'distanceToPointAlongRouteMeters'

      - name: GPS core source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R.drawable.ic_vehicle_marker' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'SymbolLayer(VEHICLE_LAYER_ID' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'ValueAnimator.ofFloat' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'evaluateOffRoute' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'shouldSnapToRoute' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'NavigationSignalFusion' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'setWaitForAccurateLocation(true)' app/src/main/java/ir/rahyar/app/core/location/FusedLocationProviderImpl.kt
          grep -q 'setMinUpdateIntervalMillis(500L)' app/src/main/java/ir/rahyar/app/core/location/FusedLocationProviderImpl.kt

      - name: Road awareness source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OverpassRoadAwarenessApi' app/src/main/java/ir/rahyar/app/data/remote/RoadAwarenessApi.kt
          grep -q 'way\["maxspeed"\]' app/src/main/java/ir/rahyar/app/data/remote/RoadAwarenessApi.kt
          grep -q 'speed_camera' app/src/main/java/ir/rahyar/app/data/remote/RoadAwarenessApi.kt
          grep -q 'traffic_calming' app/src/main/java/ir/rahyar/app/data/remote/RoadAwarenessApi.kt
          grep -q 'hazard' app/src/main/java/ir/rahyar/app/data/remote/RoadAwarenessApi.kt
          grep -q 'evaluateDriverAlert' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'speedLimitKmh' app/src/main/java/ir/rahyar/app/ui/components/NavigationHud.kt
          grep -q 'ic_speed_camera' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'ic_speed_bump' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'ic_road_hazard' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt

      - name: POI and itinerary source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aheadRouteWindow' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'matchPoiToAheadRoute' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'maxDistanceFromRouteMeters = 1_200.0' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'mapNotNull' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'baseline = base ?: error' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'stop.status == StopStatus.PENDING' app/src/main/java/ir/rahyar/app/navigation/NavigationSession.kt
          grep -q 'selectingRerouteWhileNavigatingDoesNotEndSession' app/src/test/java/ir/rahyar/app/navigation/NavigationSessionWaypointTest.kt
          grep -q 'remoteZarandCandidateIsRejected' app/src/test/java/ir/rahyar/app/core/navigation/RoutePoiFilterTest.kt
          grep -q 'calculatePoiDetour' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'unavailableBaseRouteNeverProducesFakeZeroDetour' app/src/test/java/ir/rahyar/app/core/navigation/PoiDetourTest.kt
          grep -q 'arrivingAtStopThenSelectingContinuationRouteKeepsFinalDestinationAndSessionAlive' app/src/test/java/ir/rahyar/app/navigation/NavigationSessionWaypointTest.kt
          grep -q 'splitRouteByPendingStops' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'routeSegmentPolylines' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'segmentColors' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'twoPendingStopsProduceThreeIndependentSegments' app/src/test/java/ir/rahyar/app/core/navigation/RouteSegmentPlannerTest.kt

      - name: GPS rendering and HUD source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R.drawable.ic_vehicle_marker' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'SymbolLayer(VEHICLE_LAYER_ID' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          ! grep -q 'var locationMarker' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'ValueAnimator.ofFloat' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'duration = 780L' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'interpolateGeoPoint' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'cameraBearingForMode(quickSettings.mapViewMode, current.bearing)' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'forwardPoint(location, current.bearing, lookAheadMeters)' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'offRouteConfirmationsRequired(decision, speedMps)' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'displaySpeedKmh(signal.speedMps)' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'naturalPersianManeuver' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'estimateRemainingMinutes' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'distanceToNextManeuverMeters = maneuver?.distanceMeters' app/src/main/java/ir/rahyar/app/core/navigation/NavigationEngine.kt
          grep -q 'active.speedLimitKmh' app/src/main/java/ir/rahyar/app/ui/components/NavigationHud.kt
          ! grep -q 'destinationMarker' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'geoInterpolationProducesTrueMidpointInsteadOfJump' app/src/test/java/ir/rahyar/app/core/navigation/NavigationPresentationPolicyTest.kt
          grep -q 'severeOffRouteReroutesOnFirstConfirmedFix' app/src/test/java/ir/rahyar/app/core/navigation/NavigationPresentationPolicyTest.kt
          grep -q 'headingUpCameraUsesVehicleBearing' app/src/test/java/ir/rahyar/app/core/navigation/NavigationPresentationPolicyTest.kt
          grep -q 'fusedSpeedIsConvertedDirectlyToHudKmh' app/src/test/java/ir/rahyar/app/core/navigation/NavigationPresentationPolicyTest.kt

      - name: Route Session Trace Story separation checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fun buildRouteSummary(route: Route)' app/src/main/java/ir/rahyar/app/core/navigation/JourneySeparation.kt
          grep -q 'fun buildTripSummary(trace: TripTrace)' app/src/main/java/ir/rahyar/app/core/navigation/JourneySeparation.kt
          grep -q 'fun buildTripStoryPayload(trace: TripTrace)' app/src/main/java/ir/rahyar/app/core/navigation/JourneySeparation.kt
          ! grep -q 'fun buildTripStoryPayload.*Route' app/src/main/java/ir/rahyar/app/core/navigation/JourneySeparation.kt
          grep -q 'rerouteChangesRouteWithoutResettingSessionOrTrace' app/src/test/java/ir/rahyar/app/core/navigation/JourneySeparationTest.kt
          grep -q 'storyPayloadCopiesTraceListAndDoesNotShareMutableList' app/src/test/java/ir/rahyar/app/core/navigation/JourneySeparationTest.kt
          grep -q 'val storyPayload = buildTripStoryPayload(session.tripTrace)' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          ! grep -A4 'private fun TripStorySheet(' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt | grep -q 'route: Route'

      - name: Provider manager source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'api.heigit.org/openrouteservice/v2/directions' app/src/main/java/ir/rahyar/app/data/remote/DirectionsApi.kt
          ! grep -q 'api.openrouteservice.org/v2/directions' app/src/main/java/ir/rahyar/app/data/remote/DirectionsApi.kt
          grep -q 'FallbackDirectionsApi(primary = ors, fallback = osrm)' app/src/main/java/ir/rahyar/app/di/AppModule.kt
          grep -q 'ObservedDirectionsApi(ProviderTelemetry.OSRM' app/src/main/java/ir/rahyar/app/di/AppModule.kt
          grep -q 'ObservedWeatherApi(ProviderTelemetry.OPEN_METEO' app/src/main/java/ir/rahyar/app/di/AppModule.kt
          grep -q 'ObservedTrafficApi(ProviderTelemetry.HERE_TRAFFIC' app/src/main/java/ir/rahyar/app/di/AppModule.kt
          grep -q 'ProviderTelemetry.PHOTON' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'ProviderTelemetry.NOMINATIM' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'successTracksLatencyAndQuota' app/src/test/java/ir/rahyar/app/core/provider/ProviderTelemetryTest.kt
          grep -q 'osrmFallbackRunsWhenPrimaryFails' app/src/test/java/ir/rahyar/app/data/remote/FallbackDirectionsApiTest.kt
          grep -q 'unavailableTrafficDoesNotFabricateLiveTraffic' app/src/test/java/ir/rahyar/app/data/remote/ProviderIntegrityTest.kt

      - name: Live OSRM fallback smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 35             'https://router.project-osrm.org/route/v1/driving/50.950,35.830;51.000,35.820?overview=false&steps=false'             > /tmp/osrm.json
          jq -e '.code == "Ok"' /tmp/osrm.json >/dev/null
          jq -e '.routes | length > 0' /tmp/osrm.json >/dev/null
          echo "OSRM public fallback returned a real route."

      - name: HeiGIT ORS endpoint smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 25 -o /tmp/ors-options.txt -w '%{http_code}'             -X OPTIONS 'https://api.heigit.org/openrouteservice/v2/directions/driving-car/json')"
          case "$code" in
            200|204|401|403) ;;
            *) echo "Unexpected HeiGIT status: $code"; exit 1 ;;
          esac
          echo "HeiGIT OpenRouteService endpoint is reachable: HTTP $code"

      - name: Live ORS authenticated smoke
        if: ${{ env.ORS_API_KEY != '' }}
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35             -H "Authorization: $ORS_API_KEY"             -H 'Content-Type: application/json'             --data '{"coordinates":[[50.950,35.830],[51.000,35.820]]}'             'https://api.heigit.org/openrouteservice/v2/directions/driving-car/json'             > /tmp/ors-live.json
          jq -e '.routes | length > 0' /tmp/ors-live.json >/dev/null
          echo "Authenticated ORS route succeeded."

      - name: Live HERE Traffic authenticated smoke
        if: ${{ env.HERE_API_KEY != '' }}
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 35             "https://data.traffic.hereapi.com/v7/flow?in=bbox:50.94,35.81,51.01,35.84&locationReferencing=shape&apiKey=$HERE_API_KEY"             > /tmp/here-traffic.json
          jq -e '.results | type == "array"' /tmp/here-traffic.json >/dev/null
          echo "Authenticated HERE Traffic request succeeded."

      - name: Search quality source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'photon.komoot.io' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'fetchNominatim' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'lastKnownBias' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'rankSearchResults' app/src/main/java/ir/rahyar/app/data/repository/DestinationSearchRepositoryImpl.kt
          grep -q 'normalizePersianSearch' app/src/main/java/ir/rahyar/app/core/search/SearchRanking.kt
          grep -q 'persianSemanticScore' app/src/main/java/ir/rahyar/app/core/search/SearchRanking.kt
          grep -q 'irrelevantRandomResultIsRejected' app/src/test/java/ir/rahyar/app/core/search/SearchRankingTest.kt
          grep -q 'closerResultWinsWhenSemanticBucketIsEqual' app/src/test/java/ir/rahyar/app/core/search/SearchRankingTest.kt

      - name: Live Photon and Nominatim smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 35             -A 'RahYar/1.6.2 Android'             'https://photon.komoot.io/api/?q=Tehran&limit=2&lang=en&lat=35.7&lon=51.4'             > /tmp/photon.json
          jq -e '.features | type == "array"' /tmp/photon.json >/dev/null

          curl --fail --silent --show-error --retry 2 --max-time 35             -A 'RahYar/1.6.2 Android'             'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=ir&limit=1&q=Tehran'             > /tmp/nominatim.json
          jq -e 'type == "array"' /tmp/nominatim.json >/dev/null
          echo "Photon primary and Nominatim fallback providers responded."

      - name: Weather awareness source contract checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OpenMeteoWeatherApi' app/src/main/java/ir/rahyar/app/data/remote/WeatherApi.kt
          grep -q 'RouteWeatherSnapshot' app/src/main/java/ir/rahyar/app/domain/models/Weather.kt
          grep -q 'classifyWeatherHazards' app/src/main/java/ir/rahyar/app/core/weather/WeatherHazards.kt
          grep -q 'WeatherHazard.RAIN' app/src/main/java/ir/rahyar/app/core/weather/WeatherHazards.kt
          grep -q 'WeatherHazard.SNOW' app/src/main/java/ir/rahyar/app/core/weather/WeatherHazards.kt
          grep -q 'WeatherHazard.FOG' app/src/main/java/ir/rahyar/app/core/weather/WeatherHazards.kt
          grep -q 'liveWeather' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'rahyar-weather-alert' app/src/main/java/ir/rahyar/app/ui/screens/ActiveNavigationScreen.kt
          grep -q 'timelinePreservesLiveRouteSnapshots' app/src/test/java/ir/rahyar/app/core/weather/WeatherHazardsTest.kt

      - name: Live Open-Meteo smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 35             'https://api.open-meteo.com/v1/forecast?latitude=35.8327&longitude=50.9916&current=temperature_2m,weather_code,precipitation,wind_speed_10m&timezone=auto'             > /tmp/open-meteo.json
          jq -e '.current.temperature_2m != null' /tmp/open-meteo.json >/dev/null
          jq -e '.current.weather_code != null' /tmp/open-meteo.json >/dev/null
          jq -e '.current.precipitation != null' /tmp/open-meteo.json >/dev/null
          jq -e '.current.wind_speed_10m != null' /tmp/open-meteo.json >/dev/null
          echo "Open-Meteo live weather provider returned current data."

      - name: Live speed-limit provider smoke
        shell: bash
        run: |
          set -euo pipefail
          QUERY='[out:json][timeout:15];way["maxspeed"](35.68,51.35,35.75,51.45);out tags 5;'
          curl --fail --silent --show-error --retry 2 --max-time 35             --data-urlencode "data=$QUERY"             https://overpass-api.de/api/interpreter > /tmp/overpass-speed.json
          jq -e '.elements | length > 0' /tmp/overpass-speed.json >/dev/null
          jq -e '[.elements[].tags.maxspeed? | select(. != null and . != "")] | length > 0' /tmp/overpass-speed.json >/dev/null
          echo "Overpass speed-limit provider returned live maxspeed data."

      - name: Supply temporary compile-only font resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/res/font
          FONT="$(fc-match 'DejaVu Sans' -f '%{file}\n' | head -n1)"
          cp "$FONT" project/app/src/main/res/font/iransans_regular.ttf
          cp "$FONT" project/app/src/main/res/font/iransans_medium.ttf
          cp "$FONT" project/app/src/main/res/font/iransans_bold.ttf

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Unit tests and compile
        working-directory: project
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace

  qa-evidence:
    name: Strict QA Evidence Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all required evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e . qa/RahYar_QA_Checklist_v1.5.5.json >/dev/null
          failed=0

          while IFS=$'\t' read -r group item required; do
            [ "$required" = "true" ] || continue
            f="qa/evidence/$group/$item.json"
            if [ ! -f "$f" ] || [ "$(jq -r '.pass // false' "$f" 2>/dev/null || echo false)" != "true" ]; then
              echo "QA FAIL: $group.$item"
              failed=1
            fi
          done < <(
            jq -r '.blocking | to_entries[] | .key as $g | .value | to_entries[] | [$g,.key,(.value|tostring)] | @tsv' qa/RahYar_QA_Checklist_v1.5.5.json
          )

          while IFS=$'\t' read -r item required; do
            [ "$required" = "true" ] || continue
            f="qa/evidence/acceptance/$item.json"
            if [ ! -f "$f" ] || [ "$(jq -r '.pass // false' "$f" 2>/dev/null || echo false)" != "true" ]; then
              echo "QA FAIL: acceptance.$item"
              failed=1
            fi
          done < <(
            jq -r '.acceptance_gate | to_entries[] | [.key,(.value|tostring)] | @tsv' qa/RahYar_QA_Checklist_v1.5.5.json
          )

          [ "$failed" -eq 0 ] || { echo "Release APK blocked by QA evidence gate."; exit 1; }

  release-apk:
    name: Release APK
    needs: [compile-check, qa-evidence]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All strict QA evidence passed; release packaging may proceed."
