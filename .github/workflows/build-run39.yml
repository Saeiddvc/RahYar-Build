name: RahYar Run 40 PRD Regression Fix
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['.github/workflows/build-run39.yml','ci/run40.patch.b64','ci/run40.tail']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/source.part0.b64 ci/source.part1.b64 ci/source.part2.b64 ci/source.part3.b64 | base64 -d > /tmp/base.tar.zst
          mkdir project && tar --zstd -xf /tmp/base.tar.zst -C project
          cat ci/run40.patch.b64 ci/run40.tail | base64 -d > /tmp/patch.tar.zst
          tar --zstd -xf /tmp/patch.tar.zst -C project
          grep -q 'versionCode = 18' project/app/build.gradle.kts
      - name: Supply CI Persian font fallback
        run: |
          mkdir -p project/app/src/main/res/font
          FONT="$(fc-match 'DejaVu Sans' -f '%{file}\n' | head -n1)"
          cp "$FONT" project/app/src/main/res/font/iransans_regular.ttf
          cp "$FONT" project/app/src/main/res/font/iransans_medium.ttf
          cp "$FONT" project/app/src/main/res/font/iransans_bold.ttf
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: project
        env: { ORS_API_KEY: '', HERE_API_KEY: '' }
        run: gradle assembleDebug --stacktrace
      - name: Package
        run: |
          APK="$(find project/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          cp "$APK" RahYar-1.5.6-Run40-PRD-Regression-Fix.apk
          sha256sum RahYar-1.5.6-Run40-PRD-Regression-Fix.apk > RahYar-1.5.6-Run40-PRD-Regression-Fix.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RahYar-1.5.6-Run40-PRD-Regression-Fix
          path: |
            RahYar-1.5.6-Run40-PRD-Regression-Fix.apk
            RahYar-1.5.6-Run40-PRD-Regression-Fix.apk.sha256
