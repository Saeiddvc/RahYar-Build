name: RahYar QA Evidence Gate

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "qa/**"
      - ".github/workflows/qa-gate.yml"
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  qa-evidence:
    name: Validate QA Evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Checklist JSON
        run: |
          set -euo pipefail
          jq -e . ./qa/RahYar_QA_Checklist_v1.5.5.json >/dev/null

      - name: Validate Evidence for Blocking Items
        run: |
          set -euo pipefail
          failed=0
          echo "Checking Blocking Items Evidence..."

          while IFS=$'\t' read -r group item required; do
            [ "$required" = "true" ] || continue
            evidence_path="./qa/evidence/$group/$item.json"

            if [ ! -f "$evidence_path" ]; then
              echo "NO EVIDENCE: $group.$item"
              failed=1
              continue
            fi

            jq -e . "$evidence_path" >/dev/null
            value="$(jq -r '.pass // false' "$evidence_path")"
            details="$(jq -r '.details // ""' "$evidence_path")"

            if [ "$value" != "true" ]; then
              echo "FAILED: $group.$item — $details"
              failed=1
            else
              echo "PASSED: $group.$item — $details"
            fi
          done < <(
            jq -r '
              .blocking
              | to_entries[]
              | .key as $group
              | .value
              | to_entries[]
              | [$group, .key, (.value|tostring)]
              | @tsv
            ' ./qa/RahYar_QA_Checklist_v1.5.5.json
          )

          if [ "$failed" -eq 1 ]; then
            echo "QA Evidence Gate FAILED — Blocking items missing or invalid."
            exit 1
          fi

      - name: Validate Evidence for Acceptance Gate
        run: |
          set -euo pipefail
          failed=0
          echo "Checking Acceptance Gate Evidence..."

          while IFS=$'\t' read -r item required; do
            [ "$required" = "true" ] || continue
            evidence_path="./qa/evidence/acceptance/$item.json"

            if [ ! -f "$evidence_path" ]; then
              echo "NO EVIDENCE: acceptance.$item"
              failed=1
              continue
            fi

            jq -e . "$evidence_path" >/dev/null
            value="$(jq -r '.pass // false' "$evidence_path")"
            details="$(jq -r '.details // ""' "$evidence_path")"

            if [ "$value" != "true" ]; then
              echo "FAILED: acceptance.$item — $details"
              failed=1
            else
              echo "PASSED: acceptance.$item — $details"
            fi
          done < <(
            jq -r '.acceptance_gate | to_entries[] | [.key, (.value|tostring)] | @tsv'               ./qa/RahYar_QA_Checklist_v1.5.5.json
          )

          if [ "$failed" -eq 1 ]; then
            echo "QA Evidence Gate FAILED — Acceptance Gate not satisfied."
            exit 1
          fi

      - name: Validate live TomTom Traffic credential
        env:
          TOMTOM_TRAFFIC_API_KEY: ${{ secrets.TOMTOM_TRAFFIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOMTOM_TRAFFIC_API_KEY" ]; then
            echo "QA LIVE FAIL: TOMTOM_TRAFFIC_API_KEY is not configured."
            exit 1
          fi
          for city in tehran karaj; do
            case "$city" in
              tehran) point='35.7219,51.3347' ;;
              karaj) point='35.8327,50.9916' ;;
            esac
            curl --fail --silent --show-error --retry 2 --max-time 35 \
              "https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?point=${point}&unit=KMPH&openLr=false&key=${TOMTOM_TRAFFIC_API_KEY}" \
              > "/tmp/tomtom-${city}.json"
            jq -e '.flowSegmentData.currentSpeed | type == "number"' "/tmp/tomtom-${city}.json" >/dev/null
            jq -e '.flowSegmentData.freeFlowSpeed | type == "number"' "/tmp/tomtom-${city}.json" >/dev/null
            jq -e '.flowSegmentData.coordinates.coordinate | length >= 2' "/tmp/tomtom-${city}.json" >/dev/null
          done
          echo "PASSED: provider_manager.tomtom_traffic_active — authenticated TomTom Traffic returned valid live responses for Tehran and Karaj."

      - name: Final Result
        run: echo "RahYar QA Evidence Gate PASSED — Build Approved."
