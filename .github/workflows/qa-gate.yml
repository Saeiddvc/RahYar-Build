name: RahYar QA Evidence Gate

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "qa/**"
      - ".github/workflows/qa-gate.yml"
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  qa-evidence:
    name: Validate QA Evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Checklist JSON
        run: |
          set -euo pipefail
          jq -e . ./qa/RahYar_QA_Checklist_v1.5.5.json >/dev/null

      - name: Validate Evidence for Blocking Items
        run: |
          set -euo pipefail
          failed=0
          echo "Checking Blocking Items Evidence..."

          while IFS=$'\t' read -r group item required; do
            [ "$required" = "true" ] || continue
            evidence_path="./qa/evidence/$group/$item.json"

            if [ ! -f "$evidence_path" ]; then
              echo "NO EVIDENCE: $group.$item"
              failed=1
              continue
            fi

            jq -e . "$evidence_path" >/dev/null
            value="$(jq -r '.pass // false' "$evidence_path")"
            details="$(jq -r '.details // ""' "$evidence_path")"

            if [ "$value" != "true" ]; then
              echo "FAILED: $group.$item — $details"
              failed=1
            else
              echo "PASSED: $group.$item — $details"
            fi
          done < <(
            jq -r '
              .blocking
              | to_entries[]
              | .key as $group
              | .value
              | to_entries[]
              | [$group, .key, (.value|tostring)]
              | @tsv
            ' ./qa/RahYar_QA_Checklist_v1.5.5.json
          )

          if [ "$failed" -eq 1 ]; then
            echo "QA Evidence Gate FAILED — Blocking items missing or invalid."
            exit 1
          fi

      - name: Validate Evidence for Acceptance Gate
        run: |
          set -euo pipefail
          failed=0
          echo "Checking Acceptance Gate Evidence..."

          while IFS=$'\t' read -r item required; do
            [ "$required" = "true" ] || continue
            evidence_path="./qa/evidence/acceptance/$item.json"

            if [ ! -f "$evidence_path" ]; then
              echo "NO EVIDENCE: acceptance.$item"
              failed=1
              continue
            fi

            jq -e . "$evidence_path" >/dev/null
            value="$(jq -r '.pass // false' "$evidence_path")"
            details="$(jq -r '.details // ""' "$evidence_path")"

            if [ "$value" != "true" ]; then
              echo "FAILED: acceptance.$item — $details"
              failed=1
            else
              echo "PASSED: acceptance.$item — $details"
            fi
          done < <(
            jq -r '.acceptance_gate | to_entries[] | [.key, (.value|tostring)] | @tsv'               ./qa/RahYar_QA_Checklist_v1.5.5.json
          )

          if [ "$failed" -eq 1 ]; then
            echo "QA Evidence Gate FAILED — Acceptance Gate not satisfied."
            exit 1
          fi

      - name: Final Result
        run: echo "RahYar QA Evidence Gate PASSED — Build Approved."
