name: RahYar Run57 – Final Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.7.3-run57*'

permissions:
  contents: read

jobs:
  final-release:
    name: Run57 Strict Final Release Gate
    runs-on: ubuntu-latest
    env:
      TOMTOM_TRAFFIC_API_KEY: ${{ secrets.TOMTOM_TRAFFIC_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enforce Run57 Contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .product == "RahYar" and
            .package == "ir.rahyar.app" and
            .version == "1.7.3" and
            .versionCode == 35 and
            .versionName == "1.7.3-run57-final-font-structure" and
            .run == "Run57-FinalRelease" and
            .release_gate == "STRICT" and
            .acceptance_gate.must_pass_all_steps == true and
            .acceptance_gate.final_release_condition == "ALL_STEPS_PASS" and
            .acceptance_gate.allow_partial_release == false
          ' qa/RahYar_Run57_FinalRelease.json >/dev/null

      - name: Require TomTom Traffic Credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOMTOM_TRAFFIC_API_KEY:-}" ]; then
            echo "::error::TOMTOM_TRAFFIC_API_KEY is not configured."
            exit 1
          fi
          echo "::add-mask::${TOMTOM_TRAFFIC_API_KEY}"
          echo "TomTom credential is configured."

      - name: Authenticated TomTom Traffic Live Smoke for Tehran and Karaj
        shell: bash
        run: |
          set -euo pipefail
          for city in tehran karaj; do
            case "$city" in
              tehran) point='35.7219,51.3347' ;;
              karaj) point='35.8327,50.9916' ;;
            esac
            curl --fail --silent --show-error --retry 2 --max-time 35 \
              "https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?point=${point}&unit=KMPH&openLr=false&key=${TOMTOM_TRAFFIC_API_KEY}" \
              > "/tmp/tomtom-${city}.json"
            jq -e '.flowSegmentData.currentSpeed | type == "number"' "/tmp/tomtom-${city}.json" >/dev/null
            jq -e '.flowSegmentData.freeFlowSpeed | type == "number"' "/tmp/tomtom-${city}.json" >/dev/null
            jq -e '.flowSegmentData.coordinates.coordinate | length >= 2' "/tmp/tomtom-${city}.json" >/dev/null
          done
          echo "Authenticated TomTom Traffic returned live flow data for Tehran and Karaj."

      - name: Reject Compile-only Placeholder Fonts From Final Release
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "fc-match 'DejaVu Sans'" .github/workflows/build-run39.yml; then
            echo "::error::Development workflow still injects DejaVu Sans as compile-only font resources. This candidate must not be promoted to Final Release."
            exit 1
          fi
          if grep -Fq 'Supply temporary compile-only font resources' .github/workflows/build-run39.yml; then
            echo "::error::Compile-only font substitution is still present in the development workflow."
            exit 1
          fi

      - name: Validate Strict QA Evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e . qa/RahYar_QA_Checklist_v1.5.5.json >/dev/null
          failed=0

          while IFS=$'\t' read -r group item required; do
            [ "$required" = "true" ] || continue
            file="qa/evidence/$group/$item.json"
            if [ ! -f "$file" ] || [ "$(jq -r '.pass // false' "$file" 2>/dev/null || echo false)" != "true" ]; then
              echo "QA FAIL: $group.$item"
              failed=1
            fi
          done < <(
            jq -r '.blocking | to_entries[] | .key as $g | .value | to_entries[] | [$g,.key,(.value|tostring)] | @tsv' qa/RahYar_QA_Checklist_v1.5.5.json
          )

          while IFS=$'\t' read -r item required; do
            [ "$required" = "true" ] || continue
            file="qa/evidence/acceptance/$item.json"
            if [ ! -f "$file" ] || [ "$(jq -r '.pass // false' "$file" 2>/dev/null || echo false)" != "true" ]; then
              echo "QA FAIL: acceptance.$item"
              failed=1
            fi
          done < <(
            jq -r '.acceptance_gate | to_entries[] | [.key,(.value|tostring)] | @tsv' qa/RahYar_QA_Checklist_v1.5.5.json
          )

          [ "$failed" -eq 0 ] || exit 1
          echo "All strict QA evidence is PASS."

      - name: Final Release Packaging Guard
        shell: bash
        run: |
          set -euo pipefail
          echo "Run57 strict gates passed to packaging boundary."
          echo "Final APK packaging is permitted only from an authoritative source build containing the approved IRANSans FaNum binaries."
