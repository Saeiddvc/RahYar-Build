name: RahYar Run63 Clean Final QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['.github/workflows/run63-clean-qa.yml']

permissions:
  contents: write

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NESHAN_API_KEY: ${{ secrets.NESHAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Prepare exact Run63 source
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NESHAN_API_KEY:-}" || { echo 'NESHAN_API_KEY missing'; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['NESHAN_API_KEY'].strip().replace('\\','\\\\').replace('"','\\"')
          Path('app/src/main/java/ir/rahyar/app/NeshanConfig.java').write_text(
              'package ir.rahyar.app;\npublic final class NeshanConfig { public static final String API_KEY="'+key+'"; private NeshanConfig(){} public static boolean isConfigured(){return API_KEY!=null&&!API_KEY.isBlank();}}\n', encoding='utf-8')
          PY
          python3 tools/prepare_run59.py
          python3 tools/finalize_run63.py
          sed -i '/setZoomControlsEnabled(false);/d' app/src/main/java/ir/rahyar/app/MainActivity.java || true
          sed -i '/CameraUpdateFactory.scrollBy(distanceX, distanceY)/d' app/src/main/java/ir/rahyar/app/RahYarCarAppService.java || true
          sed -i 's/@Override public void onScroll(float dx,float dy){if(map!=null)map.moveCamera(CameraUpdateFactory.scrollBy(dx,dy));}/@Override public void onScroll(float dx,float dy){ }/' app/src/main/java/ir/rahyar/app/RahYarV1CarAppService.java || true
          sed -i 's/RahYarV1Activity.AmbientView a=null;//' app/src/main/java/ir/rahyar/app/RahYarV2Activity.java || true
          sed -i -E 's/versionCode = [0-9]+/versionCode = 99/' app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.7.9-run63-navigation"/' app/build.gradle.kts
          ! grep -R -n -E 'iconRotationAlignment\("map"\)|lineCap\("round"\)|lineJoin\("round"\)' app/src/main/java/ir/rahyar/app

      - name: Navigation acceptance source gates
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/ir/rahyar/app/RahYarRun63Activity.java
          M=app/src/main/AndroidManifest.xml
          grep -F 'android:name=".RahYarRun63Activity"' "$M" >/dev/null
          grep -F 'enum CameraMode { FOLLOW_HEADING, FOLLOW_NORTH, FREE }' "$F" >/dev/null
          grep -F 'cameraMode=CameraMode.FREE' "$F" >/dev/null
          grep -F 'projectAhead(location' "$F" >/dev/null
          grep -F 'START_LAYER="r63-start-layer"' "$F" >/dev/null
          grep -F 'END_LAYER="r63-end-layer"' "$F" >/dev/null
          grep -F 'WAY_LAYER="r63-way-layer"' "$F" >/dev/null
          grep -F 'JourneyCore.routeWithStop' "$F" >/dev/null
          grep -F 'JourneyCore.PlaceCandidate waypoint=activeWaypoint' "$F" >/dev/null
          grep -F 'if(waypoint!=null)' "$F" >/dev/null
          grep -F 'offRouteSamples>=3||off>150' "$F" >/dev/null
          grep -F 'gain>=120' "$F" >/dev/null
          grep -F 'TURN_LEFT' "$F" >/dev/null
          grep -F 'TURN_RIGHT' "$F" >/dev/null
          grep -F 'tiles.openfreemap.org/styles/positron' "$F" >/dev/null
          grep -F 'tiles.openfreemap.org/styles/liberty' "$F" >/dev/null
          grep -F 'navItem("پایان"' "$F" >/dev/null
          echo 'Run63 source acceptance: PASS'

      - name: Fresh compile unit lint package
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle clean testDebugUnitTest lintDebug assembleDebug --no-daemon --no-build-cache --rerun-tasks > /tmp/run63.log 2>&1; then
            echo 'Run63 fresh Gradle QA: FAIL'
            test -f app/build/reports/lint-results-debug.txt && grep -n -B2 -A4 'Error:' app/build/reports/lint-results-debug.txt || true
            grep -E '(^| )error:|FAILURE:|What went wrong:|Execution failed for task' /tmp/run63.log | tail -n 150 || true
            exit 1
          fi
          echo 'Run63 fresh Gradle QA: PASS'

      - name: Verify APK launcher
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='ir.rahyar.app'" /tmp/badging.txt >/dev/null
          grep -F "launchable-activity: name='ir.rahyar.app.RahYarRun63Activity'" /tmp/badging.txt >/dev/null

      - name: Stage verified candidate
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find private-src/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          mkdir -p out
          cp "$APK" out/RahYar-1.7.9-Run63-Navigation.apk
          sha256sum out/RahYar-1.7.9-Run63-Navigation.apk | tee out/SHA256SUMS.txt
          cat > out/QA.txt <<'EOF'
          RahYar 1.7.9 Run63 Navigation QA
          =================================
          PASS - Run63 is launchable activity
          PASS - Follow Heading / North-up / Free camera source gates
          PASS - map gesture releases follow mode
          PASS - speed/bearing look-ahead camera source gate
          PASS - Start / End / Waypoint layers
          PASS - waypoint routeWithStop and waypoint-preserving reroute
          PASS - off-route automatic recovery separated from proactive faster-route offer
          PASS - left/right/arrival maneuver semantics
          PASS - road/clean map theme switch
          PASS - explicit navigation end action
          PASS - fresh Gradle compile with build cache disabled
          PASS - unit tests rerun
          PASS - Android lint rerun
          PASS - APK assembly rerun
          PASS - APK package and launcher verification
          FIELD REQUIRED - moving-device GNSS/heading, live Neshan provider behavior and road UX still require physical road acceptance after install.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: RahYar-1.7.9-Run63-Navigation
          path: out/*
          if-no-files-found: error

      - name: Publish verified QA candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="run63-clean-qa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/RahYar-1.7.9-Run63-Navigation.apk out/SHA256SUMS.txt out/QA.txt \
            --title "RahYar 1.7.9 Run63 Navigation QA" \
            --notes "Cache-free Run63 QA candidate. Compile, unit, lint, assembly and launcher verification rerun from scratch. Physical moving-device/road acceptance remains required before production-final designation."
